<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeTrigger AI</title>
<style>
:root {
  --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0;
  --text: #1e293b; --text-sec: #64748b; --text-ter: #94a3b8;
  --pri: #3b82f6; --pri-hover: #2563eb; --pri-light: #eff6ff;
  --danger: #ef4444; --danger-light: #fef2f2;
  --success: #22c55e; --success-light: #f0fdf4;
  --warning: #f59e0b; --warning-light: #fffbeb;
  --purple: #8b5cf6; --purple-light: #f5f3ff;
  --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; flex-wrap: wrap; }
.header h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.header h1 small { font-size: 11px; font-weight: 500; color: var(--text-ter); }
.header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.main { display: flex; flex: 1; overflow: hidden; }
.calendar-wrap { flex: 1; padding: 16px; overflow-y: auto; min-width: 0; }
.panel { width: 400px; border-left: 1px solid var(--border); background: var(--surface); overflow-y: auto; flex-shrink: 0; display: none; }
.panel.open { display: block; }
@media (max-width: 860px) {
  .main { flex-direction: column; overflow-y: auto; }
  .panel { width: 100%; border-left: none; border-top: 1px solid var(--border); }
}
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: all .15s; white-space: nowrap; }
.btn:hover { background: var(--bg); }
.btn-pri { background: var(--pri); color: #fff; border-color: var(--pri); }
.btn-pri:hover { background: var(--pri-hover); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.btn-icon { width: 32px; height: 32px; padding: 0; justify-content: center; border-radius: 50%; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 12px; background: var(--pri-light); color: var(--pri); cursor: pointer; border: 1px solid transparent; }
.pill:hover { border-color: var(--pri); }
.fc { font-size: 13px; }
.fc .fc-button { font-size: 12px; padding: 4px 10px; border-radius: var(--radius); }
.fc .fc-button-primary { background: var(--pri); border-color: var(--pri); }
.fc .fc-event { border-radius: 4px; padding: 1px 4px; font-size: 11px; cursor: pointer; border: none; }
.fc .fc-day-today { background: var(--pri-light) !important; }
/* 달 이동: ‹ 2026년 11월 › */
.fc .fc-toolbar-chunk:nth-child(2) { display: flex; align-items: center; gap: 4px; }
.fc .fc-toolbar-title { font-size: 20px; font-weight: 700; min-width: 150px; text-align: center; }
.fc .fc-prev-button, .fc .fc-next-button {
  width: 36px; height: 36px; padding: 0; border-radius: 50% !important;
  background: transparent !important; border: 1px solid var(--border) !important; color: var(--text) !important;
  box-shadow: none !important; margin: 0 !important; display: inline-flex; align-items: center; justify-content: center;
}
.fc .fc-prev-button:hover, .fc .fc-next-button:hover { background: var(--pri-light) !important; border-color: var(--pri) !important; color: var(--pri) !important; }
.fc .fc-prev-button:focus-visible, .fc .fc-next-button:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; }
.fc .fc-today-button { background: var(--surface) !important; color: var(--pri) !important; border: 1px solid var(--pri) !important; }
.fc .fc-today-button:disabled { opacity: .45; }
@media (max-width: 600px) {
  .fc .fc-toolbar { flex-wrap: wrap; gap: 8px; }
  .fc .fc-toolbar-chunk:nth-child(2) { order: -1; width: 100%; justify-content: center; }
  .fc .fc-toolbar-title { font-size: 17px; min-width: 120px; }
}
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; display: none; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: var(--surface); border-radius: 14px; width: 90%; max-width: 460px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sec); margin-bottom: 4px; }
.form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; background: var(--surface); color: var(--text); }
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
.form-row { display: flex; gap: 10px; } .form-row > * { flex: 1; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.hint { font-size: 11px; margin-top: 4px; padding: 4px 8px; border-radius: 6px; background: var(--pri-light); color: var(--pri); display: none; }
.panel-header { padding: 16px; border-bottom: 1px solid var(--border); }
.panel-header h3 { font-size: 15px; font-weight: 700; }
.panel-event-info { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.badge { display: inline-flex; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.count-bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg); font-size: 12px; color: var(--text-sec); flex-wrap: wrap; }
.count-bar .count { font-weight: 700; color: var(--pri); }
.panel-body { padding: 16px; }
.policy-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; cursor: pointer; transition: all .15s; }
.policy-card:hover { border-color: var(--pri); box-shadow: var(--shadow); }
.policy-card h4 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.policy-card > p { font-size: 12px; color: var(--text-sec); }
.meta { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.policy-detail { font-size: 12px; color: var(--text-sec); margin-top: 8px; line-height: 1.6; display: none; }
.policy-card.expanded .policy-detail { display: block; }
.evidence { margin-top: 6px; padding: 6px 10px; border-left: 3px solid var(--pri); background: var(--pri-light); color: var(--text); border-radius: 0 6px 6px 0; }
.check { margin-top: 6px; padding: 6px 10px; background: var(--warning-light); border-radius: 6px; color: #92400e; }
.relevance-direct { background: var(--pri); color: #fff; }
.relevance-related { background: var(--purple-light); color: var(--purple); }
.status-open { background: var(--success-light); color: #16a34a; }
.status-upcoming { background: var(--warning-light); color: #d97706; }
.status-unknown { background: #f1f5f9; color: var(--text-sec); }
.status-closed { background: #f1f5f9; color: var(--text-ter); }
.elig-met { background: var(--success-light); color: #16a34a; }
.elig-check { background: var(--warning-light); color: #d97706; }
.gray { background: #f1f5f9; color: var(--text-sec); }
.notice { font-size: 12px; padding: 8px 10px; border-radius: 8px; background: var(--warning-light); color: #92400e; margin-bottom: 10px; }
.disclaimer { font-size: 11px; color: var(--text-ter); margin-top: 12px; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-sec); }
.empty-state .icon { font-size: 36px; margin-bottom: 10px; }
.empty-state p { font-size: 13px; }
.question { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }
.question h4 { font-size: 13px; margin-bottom: 4px; }
.question .why { font-size: 11px; color: var(--text-ter); margin-bottom: 8px; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.opts .btn.sel { background: var(--pri); color: #fff; border-color: var(--pri); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--pri); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.closed-toggle { font-size: 12px; color: var(--text-ter); cursor: pointer; padding: 6px 0; }
.closed-policies { display: none; } .closed-policies.show { display: block; } .closed-policies .policy-card { opacity: .6; }
.toast { position: fixed; top: 16px; right: 16px; padding: 12px 20px; border-radius: var(--radius); background: var(--text); color: #fff; font-size: 13px; z-index: 200; transform: translateY(-100px); transition: transform .3s; }
.toast.show { transform: translateY(0); }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>📅 LifeTrigger AI <small>일정만 적으면 받을 수 있는 청년 정책을 찾아드려요</small></h1>
    <div class="header-actions">
      <span class="pill" id="profileBadge" onclick="openProfileModal()">👤 내 정보 미설정</span>
      <button class="btn btn-sm btn-pri" onclick="openEventModal()">+ 일정</button>
      <button class="btn btn-sm btn-danger" onclick="clearAll()">초기화</button>
    </div>
  </div>
  <div class="main">
    <div class="calendar-wrap"><div id="calendar"></div></div>
    <div class="panel" id="panel">
      <div class="panel-header">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h3>🎯 추천 정책</h3>
          <button class="btn btn-icon" onclick="closePanel()">✕</button>
        </div>
        <div class="panel-event-info" id="panelEventInfo"></div>
      </div>
      <div class="count-bar" id="countBar"></div>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </div>
</div>

<!-- 일정 모달 -->
<div class="modal-overlay" id="eventModal" onclick="if(event.target===this)closeModal('eventModal')">
  <div class="modal">
    <h2 id="eventModalTitle">일정 추가</h2>
    <div class="form-group">
      <label>제목</label>
      <input id="evTitle" placeholder="예: SQLD 시험, 네이버 최종 면접" oninput="onTitleChange()">
      <div class="hint" id="classifyHint"></div>
    </div>
    <div class="form-group">
      <label>카테고리 (비워 두면 AI가 해석)</label>
      <select id="evCategory" onchange="updateExamFields()">
        <option value="">🤖 자동 (AI 해석)</option>
        <option value="JOB_INTERVIEW">💼 취업 면접</option>
        <option value="CERT_EXAM">📝 자격증 시험</option>
        <option value="LANGUAGE_EXAM">🌐 어학 시험</option>
        <option value="JOB_SEARCH">🔍 취업 활동</option>
        <option value="JOB_TRAINING">📚 직업 훈련</option>
        <option value="GENERAL">📌 일반</option>
      </select>
    </div>
    <div class="form-group" id="examFields" style="display:none">
      <label>시험 단계</label>
      <select id="evExamStage">
        <option value="EXAM_DAY">시험일</option>
        <option value="REGISTRATION">접수</option>
        <option value="RESULT">결과 발표</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group"><label>시작</label><input type="date" id="evStart"></div>
      <div class="form-group"><label>종료</label><input type="date" id="evEnd"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="evDeleteBtn" style="display:none" onclick="deleteEvent()">삭제</button>
      <div style="flex:1"></div>
      <button class="btn" onclick="closeModal('eventModal')">취소</button>
      <button class="btn btn-pri" onclick="saveEvent()">저장</button>
    </div>
  </div>
</div>

<!-- 내 정보 모달 -->
<div class="modal-overlay" id="profileModal" onclick="if(event.target===this)closeModal('profileModal')">
  <div class="modal">
    <h2>내 정보</h2>
    <p style="font-size:13px;color:var(--text-sec);margin-bottom:16px;">정책마다 연령·거주지 기준이 달라 이 두 가지만 받아요. 이 브라우저에만 저장됩니다.</p>
    <div class="form-group"><label>만 나이</label><input type="number" id="pfAge" min="15" max="45" placeholder="예: 27"></div>
    <div class="form-group"><label>시/도</label><select id="pfSido" onchange="fillSigungu('pfSigungu', this.value)"></select></div>
    <div class="form-group"><label>시/군/구</label><select id="pfSigungu"></select></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('profileModal')">취소</button>
      <button class="btn btn-pri" onclick="saveProfile()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ===== 저장소 (막혀 있어도 동작) =====
function load(key, fb) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
function dayOffset(n) { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }

function initState() {
  events = load('lt_events', []);
  profile = load('lt_profile', null);
  if (!events.length) {
    events = [
      { id: genId(), title: 'SQLD 자격증 시험', category: 'CERT_EXAM', examStage: 'EXAM_DAY', start: dayOffset(5), end: dayOffset(5) },
      { id: genId(), title: 'oo 기업 최종', category: '', start: dayOffset(3), end: dayOffset(3) },
      { id: genId(), title: 'TOEIC 접수', category: 'LANGUAGE_EXAM', examStage: 'REGISTRATION', start: dayOffset(1), end: dayOffset(1) }
    ];
    save('lt_events', events);
  }
}

// ===== 지역 =====
function fillSido(selId, value) {
  const el = document.getElementById(selId);
  el.innerHTML = '<option value="">선택하세요</option>' + REGIONS.sido.map(s => '<option value="' + s.code + '">' + esc(s.name) + '</option>').join('');
  el.value = value || '';
}
function fillSigungu(selId, sidoCode, value) {
  const el = document.getElementById(selId);
  const list = REGIONS.sigungu.filter(g => g.parent === sidoCode);
  el.innerHTML = list.length
    ? '<option value="">선택하세요</option>' + list.map(g => '<option value="' + g.code + '">' + esc(g.name) + '</option>').join('')
    : '<option value="">' + (sidoCode ? '(시/도 전체)' : '시/도를 먼저 선택하세요') + '</option>';
  el.value = value || '';
}
function regionLabel(p) {
  if (!p) return '';
  const s = REGIONS.sido.find(x => x.code === p.sidoCode);
  const g = REGIONS.sigungu.find(x => x.code === p.sigunguCode);
  return (s ? s.name : '') + (g ? ' ' + g.name : '');
}
function renderProfileBadge() {
  document.getElementById('profileBadge').textContent = profile && profile.age
    ? '👤 만 ' + profile.age + '세 · 📍 ' + (regionLabel(profile) || '지역 미설정')
    : '👤 내 정보 미설정';
}
function openProfileModal() {
  document.getElementById('pfAge').value = profile && profile.age || '';
  fillSido('pfSido', profile && profile.sidoCode);
  fillSigungu('pfSigungu', profile && profile.sidoCode, profile && profile.sigunguCode);
  document.getElementById('profileModal').classList.add('show');
}
function saveProfile() {
  const age = Number(document.getElementById('pfAge').value);
  const sidoCode = document.getElementById('pfSido').value;
  const sigunguCode = document.getElementById('pfSigungu').value;
  if (!age || !sidoCode) { toast('나이와 시/도를 입력해 주세요'); return; }
  profile = { age, sidoCode, sigunguCode };
  save('lt_profile', profile);
  Object.keys(resultCache).forEach(k => delete resultCache[k]);
  renderProfileBadge();
  closeModal('profileModal');
  if (current) requestRecommend(current, {});
}

// ===== 일정 분류 힌트 (서버에서도 규칙+AI로 다시 판단) =====
function classify(title) {
  const t = (title || '').toLowerCase();
  if (/면접관|감독관|시험\s*감독|친구.*(면접|시험)/.test(t)) return { cat: 'GENERAL', hint: '제3자 일정으로 보여요 (추천 제외)' };
  if (['toeic','toefl','ielts','opic','토익','토플','텝스','teps','jlpt','hsk'].some(k => t.includes(k))) return { cat: 'LANGUAGE_EXAM', hint: '어학 시험으로 보여요' };
  if (['기사','기능사','자격증','sqld','sqlp','리눅스마스터','컴퓨터활용','한능검','한국사'].some(k => t.includes(k))) return { cat: 'CERT_EXAM', hint: '자격증 시험으로 보여요' };
  if (/면접|인터뷰/.test(t)) return { cat: 'JOB_INTERVIEW', hint: '취업 면접으로 보여요' };
  if (/최종|1차|2차|임원|인적성|코딩\s*테스트/.test(t)) return { cat: '', hint: '면접 단계일 수 있어요 — AI가 해석합니다' };
  return { cat: '', hint: '' };
}
function onTitleChange() {
  const r = classify(document.getElementById('evTitle').value);
  const h = document.getElementById('classifyHint');
  h.textContent = r.hint; h.style.display = r.hint ? 'block' : 'none';
  if (r.cat && !editingId) { document.getElementById('evCategory').value = r.cat; updateExamFields(); }
}
function updateExamFields() {
  const c = document.getElementById('evCategory').value;
  document.getElementById('examFields').style.display = (c === 'CERT_EXAM' || c === 'LANGUAGE_EXAM') ? 'block' : 'none';
}

// ===== 일정 CRUD =====
function openEventModal(id, start, end) {
  editingId = id || null;
  const ev = id ? events.find(e => e.id === id) : null;
  document.getElementById('eventModalTitle').textContent = ev ? '일정 편집' : '일정 추가';
  document.getElementById('evTitle').value = ev ? ev.title : '';
  document.getElementById('evCategory').value = ev ? (ev.category || '') : '';
  document.getElementById('evExamStage').value = ev && ev.examStage || 'EXAM_DAY';
  document.getElementById('evStart').value = ev ? ev.start : (start || dayOffset(0));
  document.getElementById('evEnd').value = ev ? ev.end : (end || start || dayOffset(0));
  document.getElementById('evDeleteBtn').style.display = ev ? 'inline-flex' : 'none';
  document.getElementById('classifyHint').style.display = 'none';
  updateExamFields();
  document.getElementById('eventModal').classList.add('show');
  setTimeout(() => document.getElementById('evTitle').focus(), 50);
}
function saveEvent() {
  const title = document.getElementById('evTitle').value.trim();
  if (!title) { toast('제목을 입력해 주세요'); return; }
  const category = document.getElementById('evCategory').value;
  const data = {
    title, category,
    examStage: (category === 'CERT_EXAM' || category === 'LANGUAGE_EXAM') ? document.getElementById('evExamStage').value : null,
    start: document.getElementById('evStart').value,
    end: document.getElementById('evEnd').value || document.getElementById('evStart').value
  };
  let ev;
  if (editingId) { ev = events.find(e => e.id === editingId); Object.assign(ev, data); delete resultCache[ev.id]; }
  else { ev = Object.assign({ id: genId() }, data); events.push(ev); }
  save('lt_events', events);
  refreshCalendar();
  closeModal('eventModal');
  selectEvent(ev);
}
function deleteEvent() {
  events = events.filter(e => e.id !== editingId);
  save('lt_events', events);
  refreshCalendar(); closeModal('eventModal'); closePanel();
}
function clearAll() {
  if (!confirm('모든 일정과 내 정보를 지울까요?')) return;
  events = []; profile = null; save('lt_events', []); try { localStorage.removeItem('lt_profile'); } catch (e) {}
  initState(); refreshCalendar(); renderProfileBadge(); closePanel();
}
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

// ===== 캘린더 =====
function calEvents() {
  return events.map(ev => ({ id: ev.id, title: ev.title, start: ev.start, end: addDay(ev.end || ev.start), allDay: true,
    backgroundColor: CAT_COLORS[ev.category || 'AUTO'], borderColor: 'transparent' }));
}
function addDay(d) { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + 1); return x.toISOString().slice(0, 10); }
function refreshCalendar() { calendar.removeAllEvents(); calEvents().forEach(e => calendar.addEvent(e)); }
function initCalendar() {
  calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: 'dayGridMonth', locale: 'ko', height: 'auto', selectable: true, editable: true,
    headerToolbar: { left: 'today', center: 'prev title next', right: 'dayGridMonth,listMonth' },
    buttonHints: { prev: '이전 달', next: '다음 달', today: '오늘로 이동' },
    buttonText: { today: '오늘', month: '월', list: '목록' },
    events: calEvents(),
    select: info => { const end = new Date(info.end); end.setDate(end.getDate() - 1); openEventModal(null, info.startStr, end.toISOString().slice(0, 10)); },
    eventClick: info => { const ev = events.find(e => e.id === info.event.id); if (ev) selectEvent(ev); },
    eventDrop: info => {
      const ev = events.find(e => e.id === info.event.id);
      if (!ev) return;
      ev.start = info.event.startStr.slice(0, 10);
      const e2 = info.event.end ? new Date(info.event.end) : null;
      if (e2) { e2.setDate(e2.getDate() - 1); ev.end = e2.toISOString().slice(0, 10); } else ev.end = ev.start;
      delete resultCache[ev.id]; save('lt_events', events);
    }
  });
  calendar.render();
}

// ===== 패널 / 추천 =====
function closePanel() { document.getElementById('panel').classList.remove('open'); current = null; }
function selectEvent(ev) {
  current = ev;
  document.getElementById('panel').classList.add('open');
  renderEventInfo(ev, null);
  if (resultCache[ev.id]) renderResult(ev, resultCache[ev.id]);
  else requestRecommend(ev, {});
}
function renderEventInfo(ev, serverEvent) {
  const cat = (serverEvent && serverEvent.category) || ev.category;
  const stage = (serverEvent && serverEvent.examStage) || ev.examStage;
  document.getElementById('panelEventInfo').innerHTML =
    (cat ? '<span class="badge" style="background:' + CAT_COLORS[cat] + ';color:#fff">' + CAT_LABELS[cat] + '</span>' : '<span class="badge gray">🤖 AI 해석</span>') +
    (stage && STAGE_LABELS[stage] ? '<span class="badge gray">' + STAGE_LABELS[stage] + '</span>' : '') +
    '<span style="font-size:14px;font-weight:600;">' + esc(ev.title) + '</span>' +
    '<span style="font-size:12px;color:var(--text-ter)">' + esc(ev.start) + '</span>' +
    '<button class="btn btn-sm" style="margin-left:auto" onclick="openEventModal(\'' + ev.id + '\')">편집</button>';
}
function setBody(countHtml, bodyHtml) {
  document.getElementById('countBar').innerHTML = countHtml || '';
  document.getElementById('panelBody').innerHTML = bodyHtml;
}
function empty(icon, msg) { return '<div class="empty-state"><div class="icon">' + icon + '</div><p>' + msg + '</p></div>'; }

async function requestRecommend(ev, answers) {
  setBody('', '<div class="empty-state"><div class="spinner"></div><p>AI가 일정을 해석하고<br>후보 정책의 원문을 읽는 중이에요…</p></div>');
  const payload = {
    event: { id: ev.id, title: ev.title, start: ev.start, end: ev.end, category: ev.category || '', examStage: ev.examStage || '' },
    user: profile ? { age: profile.age, sidoCode: profile.sidoCode, sigunguCode: profile.sigunguCode } : {},
    answers: answers || {}
  };
  try {
    // text/plain = CORS 사전요청 없이 바로 POST (본문은 JSON 문자열, n8n 에서 파싱)
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(payload) });
    const text = await res.text();
    let data; try { data = JSON.parse(text); } catch (e) { throw new Error('응답 형식 오류 (' + res.status + ')'); }
    if (!res.ok) throw new Error(data.message || ('HTTP ' + res.status));
    if (current && current.id !== ev.id) return;
    if (data.status === 'OK' || data.status === 'NO_RECOMMEND' || data.status === 'NO_CANDIDATES') resultCache[ev.id] = data;
    renderResult(ev, data, answers);
  } catch (e) {
    setBody('', empty('⚠️', '추천을 불러오지 못했어요.<br><small>' + esc(e.message) + '</small><br><br><button class="btn btn-sm" onclick="requestRecommend(current, {})">다시 시도</button>'));
  }
}

function renderResult(ev, data, prevAnswers) {
  renderEventInfo(ev, data.event);
  if (data.status === 'NEED_INPUT') return renderQuestions(ev, data, prevAnswers || {});
  if (data.status === 'NO_RECOMMEND') return setBody('', empty('📌', esc(data.message)));
  if (data.status === 'NO_CANDIDATES') return setBody('', empty('🔍', esc(data.message)));
  const open = data.policies || [], closed = data.closedPolicies || [];
  const h = data.hidden || {};
  const hiddenCnt = (h.notRelated || 0) + (h.notEligible || 0);
  let count = '<span class="count">' + open.length + '</span>건의 추천 정책';
  if (hiddenCnt) count += ' <span style="color:var(--text-ter)">(무관·불충족 ' + hiddenCnt + '건 제외)</span>';
  if (!open.length && !closed.length) return setBody(count, empty('🔍', '조건에 맞는 정책을 찾지 못했어요.'));
  let html = (data.notices || []).map(n => '<div class="notice">⚠️ ' + esc(n) + '</div>').join('');
  html += open.map(renderCard).join('');
  if (closed.length) html += '<div class="closed-toggle" onclick="this.nextElementSibling.classList.toggle(\'show\')">▸ 마감된 정책 ' + closed.length + '건</div><div class="closed-policies">' + closed.map(renderCard).join('') + '</div>';
  html += '<p class="disclaimer">ⓘ ' + esc(data.disclaimer || '') + '</p>';
  setBody(count, html);
}

function renderCard(p) {
  const rel = p.relevance === 'DIRECT' ? '<span class="badge relevance-direct">직접 연관</span>' : '<span class="badge relevance-related">관련 정책</span>';
  const elig = p.eligibility === 'MET' ? '<span class="badge elig-met">자격 충족</span>' : '<span class="badge elig-check">확인 필요</span>';
  const st = '<span class="badge status-' + String(p.status || 'unknown').toLowerCase() + '">' + esc(p.statusLabel || p.status) + '</span>';
  const timing = p.timing && p.timing.text ? '<p style="margin-top:6px"><strong>🗓 신청 시점:</strong> ' + esc(p.timing.text) + (p.timing.applyBy ? ' (~' + esc(p.timing.applyBy) + ')' : '') + '</p>' : '';
  const evid = (p.evidence || []).map(q => '<div class="evidence">“' + esc(q) + '”</div>').join('');
  const checks = (p.checkItems || []).length ? '<div class="check"><strong>확인할 항목</strong><br>· ' + p.checkItems.map(esc).join('<br>· ') + '</div>' : '';
  return '<div class="policy-card" onclick="if(!event.target.closest(\'a\'))this.classList.toggle(\'expanded\')">' +
    '<h4>' + esc(p.title) + '</h4>' +
    '<p>' + esc((p.summary || '').slice(0, 120)) + '</p>' +
    '<div class="meta">' + rel + elig + st + '<span class="badge gray">📍 ' + esc(p.regionNames || '') + '</span></div>' +
    '<div class="policy-detail">' + timing +
      (evid ? '<p style="margin-top:6px"><strong>📄 원문 근거</strong></p>' + evid : '') + checks +
      (p.note ? '<p style="margin-top:6px"><strong>ℹ️</strong> ' + esc(p.note) + '</p>' : '') +
      (p.supportDetails ? '<p style="margin-top:6px"><strong>지원 내용:</strong> ' + esc(p.supportDetails) + '</p>' : '') +
      '<p style="margin-top:6px"><strong>담당:</strong> ' + esc(p.provider) + '</p>' +
      (p.url ? '<p style="margin-top:8px"><a href="' + esc(p.url) + '" target="_blank" rel="noopener" style="color:var(--pri);text-decoration:none">🔗 상세보기 →</a></p>' : '') +
      (p.applyUrl ? '<p style="margin-top:4px"><a href="' + esc(p.applyUrl) + '" target="_blank" rel="noopener" style="color:#16a34a;text-decoration:none">📝 신청하기 →</a></p>' : '') +
    '</div></div>';
}

// ===== 확인 질문 (최대 3개) =====
let pendingAnswers = {};
function renderQuestions(ev, data, prev) {
  pendingAnswers = Object.assign({}, prev);
  const qs = data.questions || [];
  let html = '<p style="font-size:12px;color:var(--text-sec);margin-bottom:10px">' + esc(data.message) + '</p>';
  qs.forEach(q => {
    html += '<div class="question"><h4>' + esc(q.question) + '</h4>' + (q.why ? '<div class="why">' + esc(q.why) + '</div>' : '');
    if (q.options) {
      html += '<div class="opts">' + q.options.map(o => '<button class="btn btn-sm" data-k="' + q.key + '" data-v="' + o.value + '" onclick="pickOpt(this)">' + esc(o.label) + '</button>').join('') + '</div>';
    } else if (q.type === 'number') {
      html += '<div class="form-group" style="margin:0"><input type="number" id="q_age" placeholder="예: 27" value="' + (profile && profile.age || '') + '"></div>';
    } else if (q.type === 'region') {
      html += '<div class="form-row"><div class="form-group" style="margin:0"><select id="q_sido" onchange="fillSigungu(\'q_sigungu\', this.value)"></select></div><div class="form-group" style="margin:0"><select id="q_sigungu"></select></div></div>';
    }
    html += '</div>';
  });
  html += '<button class="btn btn-pri" style="width:100%;justify-content:center" onclick="submitAnswers()">답하고 추천 받기</button>';
  setBody('<span>❓ 확인 질문 ' + qs.length + '개</span>', html);
  if (document.getElementById('q_sido')) { fillSido('q_sido', profile && profile.sidoCode); fillSigungu('q_sigungu', profile && profile.sidoCode); }
}
function pickOpt(btn) {
  btn.parentElement.querySelectorAll('.btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  pendingAnswers[btn.dataset.k] = btn.dataset.v;
}
function submitAnswers() {
  const ageEl = document.getElementById('q_age'), sidoEl = document.getElementById('q_sido'), sgEl = document.getElementById('q_sigungu');
  if (ageEl) { if (!ageEl.value) return toast('나이를 입력해 주세요'); pendingAnswers.age = Number(ageEl.value); }
  if (sidoEl) {
    if (!sidoEl.value) return toast('시/도를 선택해 주세요');
    pendingAnswers.sidoCode = sidoEl.value; pendingAnswers.sigunguCode = sgEl.value || '';
  }
  if (document.querySelector('.opts') && !document.querySelector('.opts .sel')) return toast('일정 유형을 골라 주세요');
  // 나이·지역 답변은 내 정보로 저장 (다음부터 묻지 않음)
  if (pendingAnswers.age || pendingAnswers.sidoCode) {
    profile = Object.assign({}, profile || {}, pendingAnswers.age ? { age: pendingAnswers.age } : {},
      pendingAnswers.sidoCode ? { sidoCode: pendingAnswers.sidoCode, sigunguCode: pendingAnswers.sigunguCode } : {});
    save('lt_profile', profile); renderProfileBadge();
  }
  // 일정 유형 답변은 일정에 저장
  if (pendingAnswers.category && current) { current.category = pendingAnswers.category; save('lt_events', events); refreshCalendar(); }
  requestRecommend(current, pendingAnswers);
}

if (REGION_ERROR) {
  const bar = document.createElement('div');
  bar.style.cssText = 'background:#fef2f2;color:#b91c1c;font-size:12px;padding:8px 20px;border-bottom:1px solid #fecaca';
  bar.textContent = '⚠️ 지역 목록을 불러오지 못했어요 (Supabase): ' + REGION_ERROR;
  document.querySelector('.app').insertBefore(bar, document.querySelector('.main'));
}
initState();
initCalendar();
renderProfileBadge();
if (!profile) setTimeout(openProfileModal, 400);
</script>
</body>
</html>
